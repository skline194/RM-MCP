[project]
name = "rm-mcp"
version = "0.1.0"
description = "Thin Rent Manager MCP server for Kline Properties"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "requests>=2.31.0",
]

[project.scripts]
rm-mcp = "rm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rm_mcp"]
